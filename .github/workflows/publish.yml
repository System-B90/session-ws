name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # GitHub-hosted: this repo is public, so hosted minutes are free, and the
    # self-hosted pool has not taken a job since 2026-09-19 (System-B90/.github#30).
    # Only jobs that need Docker-in-Docker stay on [self-hosted, dind].
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@system-b90'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (skip if version already on registry)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
