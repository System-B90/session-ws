name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: [master]
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Until now nothing type-checked this package on a PR — the first thing to
    # compile it was `publish.yml`, which only runs on a published release. A
    # broken build therefore surfaced at release time instead of at review
    # time, in a package three apps depend on.
    build:
        name: Build + typecheck
        runs-on: [self-hosted, node]
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  # No `cache:` on purpose. The self-hosted runners have persistent
                  # disk, so the npm cache already survives between runs — the
                  # actions/cache save is pure cost, and it is what left a job wedged
                  # in "Post Setup Node.js" for over an hour holding a runner.

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # `npm run build` emits declarations; --noEmit re-checks without
            # writing, so a stale dist/ can't mask a type error.
            - name: Typecheck
              run: npx tsc -p tsconfig.json --noEmit

            # Tests run against dist/ (`npm test` builds first), so a
            # regression in this package fails here instead of surfacing in
            # bluz or madash after publish.
            - name: Test
              run: npm test
